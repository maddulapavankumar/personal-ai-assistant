name: repo-process-guards

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  pr-template-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR template compliance
        shell: pwsh
        run: |
          ./.github/scripts/validate-pr-template.ps1

  docs-instructions-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs and instructions drift (warning only)
        shell: pwsh
        run: |
          ./.github/scripts/check-docs-instructions-drift.ps1 -BaseSha "${{ github.event.pull_request.base.sha }}" -HeadSha "${{ github.event.pull_request.head.sha }}"

